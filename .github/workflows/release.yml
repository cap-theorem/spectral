name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: tag is semver
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
      - name: tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at ${GITHUB_SHA::7}, which is not on main"
            exit 1
          fi

  promote:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/cap-theorem/spctrld
          - image: ghcr.io/cap-theorem/spectral-collector
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: wait for main build
        env:
          SOURCE: ${{ matrix.image }}
        run: |
          src="$SOURCE:sha-${GITHUB_SHA::7}"
          for _ in $(seq 60); do
            if docker buildx imagetools inspect "$src" > /dev/null 2>&1; then
              exit 0
            fi
            echo "waiting for $src"
            sleep 30
          done
          echo "::error::$src never appeared; did ci finish on main for this commit?"
          exit 1
      - name: retag
        env:
          SOURCE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            if [[ -n "$tag" ]]; then
              args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE:sha-${GITHUB_SHA::7}"

  github-release:
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          prerelease=()
          if [[ "$v" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          notes=$(printf '```\nghcr.io/cap-theorem/spctrld:%s\nghcr.io/cap-theorem/spectral-collector:%s\n```\n' "$v" "$v")
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "$notes" \
            "${prerelease[@]}"
