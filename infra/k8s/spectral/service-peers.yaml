apiVersion: v1
kind: Service
metadata:
  name: spctrld-peers
spec:
  clusterIP: None # Headless: the name resolves to every pod IP, which spctrld uses as --bootstrap seeds
  publishNotReadyAddresses: true # Let starting pods find each other before they report ready
  selector:
    app: spctrld
  ports:
    - name: quic
      port: 7000
      targetPort: quic
      protocol: UDP
