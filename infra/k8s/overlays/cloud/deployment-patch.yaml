apiVersion: apps/v1
kind: Deployment
metadata:
  name: spctrld
  namespace: spectral
spec:
  replicas: 19
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spctrld
      containers:
        - name: spctrld
          imagePullPolicy: IfNotPresent
          args:
            - "--listen-addr=$(POD_IP):7000"
            - "--api-port=8000"
            - "--bootstrap=spctrld-seed.spectral.svc.cluster.local:7000"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
