apiVersion: apps/v1
kind: Deployment
metadata:
  name: spctrld
  namespace: spectral
spec:
  replicas: 20
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: spctrld
      containers:
        - name: spctrld
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
