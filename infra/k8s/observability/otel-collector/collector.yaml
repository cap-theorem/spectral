receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: detailed
  prometheus_remote_write:
    http:
      endpoint: http://prometheus:9090/api/v1/write
      tls:
        insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [debug, prometheus_remote_write]
