---
- name: Copy the K3s admin kubeconfig to the Ansible controller
  hosts: k3s_server
  become: true
  gather_facts: false
  vars:
    local_kubeconfig_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube"
    local_kubeconfig: "{{ local_kubeconfig_dir }}/spectral-k3s.yaml"
  tasks:
    - name: Require exactly one K3s server
      ansible.builtin.assert:
        that:
          - groups['k3s_server'] | length == 1
        fail_msg: This playbook expects exactly one K3s server.

    - name: Read the K3s admin kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: remote_kubeconfig
      no_log: true

    - name: Verify the expected local API address is present
      ansible.builtin.assert:
        that:
           - "(remote_kubeconfig.content | b64decode).count('server: https://127.0.0.1:6443') == 1"
        fail_msg: Unexpected API address in the K3s kubeconfig; refusing to write the local copy.
      no_log: true

    - name: Create a private kubeconfig directory on the controller
      ansible.builtin.file:
        path: "{{ local_kubeconfig_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false

    - name: Save the kubeconfig with the server's Tailscale address
      ansible.builtin.copy:
        content: >-
          {{ (remote_kubeconfig.content | b64decode) |
             replace('server: https://127.0.0.1:6443',
                     'server: https://' ~ k3s_node_ip ~ ':6443') }}
        dest: "{{ local_kubeconfig }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        ansible_become: false
      no_log: true
